<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente do Monograma R -->
    <linearGradient id="r_main_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#003399"/>
      <stop offset="100%" stop-color="#001F54"/>
    </linearGradient>

    <!-- Gradiente Cyan / Tecnologia AI -->
    <linearGradient id="ai_cyan_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- Filtro de Brilho Suave -->
    <filter id="soft_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Anéis de Órbita / Circuitos -->
  <g filter="url(#soft_glow)">
    <path d="M 120 256 A 150 150 0 1 1 380 360" stroke="url(#ai_cyan_grad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="120" cy="256" r="7" fill="#00F2FE"/>
    <circle cx="380" cy="360" r="7" fill="#00F2FE"/>

    <path d="M 370 160 A 150 150 0 0 1 160 390" stroke="url(#r_main_grad)" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Linhas de Circuito -->
  <line x1="330" y1="190" x2="410" y2="190" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
  <circle cx="415" cy="190" r="6" fill="#00F2FE"/>

  <line x1="320" y1="225" x2="430" y2="225" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
  <circle cx="435" cy="225" r="6" fill="#00F2FE"/>

  <line x1="310" y1="260" x2="400" y2="260" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
  <circle cx="405" cy="260" r="5" fill="#00F2FE"/>

  <!-- Monograma R -->
  <g filter="url(#soft_glow)">
    <path d="M 100 110 L 220 110 C 285 110 330 145 330 205 C 330 255 295 285 245 295 L 340 410 L 265 410 L 180 305 L 180 410 L 100 410 Z" fill="url(#r_main_grad)" stroke="#00F2FE" stroke-width="2"/>
    <path d="M 180 175 L 215 175 C 245 175 260 185 260 205 C 260 225 245 235 215 235 L 180 235 Z" fill="#0B132B"/>
  </g>

  <!-- Símbolo Ai -->
  <g transform="translate(20, -10)">
    <path d="M 220 400 L 275 240 L 320 240 L 375 400 L 330 400 L 315 350 L 280 350 L 265 400 Z" fill="url(#ai_cyan_grad)"/>
    <path d="M 288 310 L 307 310 L 297 275 Z" fill="#0B132B"/>

    <path d="M 390 280 L 420 280 L 420 400 L 390 400 Z" fill="url(#ai_cyan_grad)"/>
    <circle cx="405" cy="245" r="16" fill="url(#ai_cyan_grad)"/>
  </g>
</svg>
