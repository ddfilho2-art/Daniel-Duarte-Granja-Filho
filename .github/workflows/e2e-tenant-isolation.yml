name: E2E - Multi-Tenant, Fluxo Completo e Carga

on:
  workflow_dispatch:
    inputs:
      run_tenant_isolation:
        description: "Executar E2E de isolamento multi-tenant"
        required: true
        default: true
        type: boolean
      run_full_e2e:
        description: "Executar fluxo completo candidato → candidatura → IA → score"
        required: true
        default: true
        type: boolean
      run_queue_load:
        description: "Executar teste de carga da fila de IA"
        required: true
        default: false
        type: boolean
      queue_jobs:
        description: "Quantidade de jobs sintéticos no teste de carga (1-1000)"
        required: true
        default: "200"
        type: string
      queue_concurrency:
        description: "Concorrência do teste de carga (4-32)"
        required: true
        default: "32"
        type: string
      run_real_ai_load:
        description: "Executar carga REAL da IA/Gemini"
        required: true
        default: false
        type: boolean
      real_ai_jobs:
        description: "Quantidade de análises reais com Gemini (1-200); padrão seguro para cota gratuita: 4"
        required: true
        default: "4"
        type: string
      real_ai_concurrency:
        description: "Concorrência do worker real; mantenha 1 na cota gratuita de 5 RPM"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  tenant-isolation:
    name: Segurança, dependências e isolamento multi-tenant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_QUEUE_JOBS: ${{ inputs.queue_jobs }}
      E2E_QUEUE_CONCURRENCY: ${{ inputs.queue_concurrency }}
      E2E_REAL_AI_JOBS: ${{ inputs.real_ai_jobs }}
      E2E_REAL_AI_CONCURRENCY: ${{ inputs.real_ai_concurrency }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de dependências de produção
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > audit-report.json
          audit_exit=$?
          set -e

          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("audit-report.json", "utf8"));
          const vulnerabilities = report.vulnerabilities || {};
          const ignoredBecausePatched = new Set(["proxy-addr", "source-map-js"]);
          const unexpected = [];

          for (const [name, advisory] of Object.entries(vulnerabilities)) {
            if (!ignoredBecausePatched.has(name)) {
              unexpected.push({ name, severity: advisory.severity, via: advisory.via });
              continue;
            }

            const installedPath = require.resolve(name + "/package.json");
            const installed = JSON.parse(fs.readFileSync(installedPath, "utf8"));
            const minimum = name === "proxy-addr" ? [2, 0, 8] : [1, 2, 2];
            const actual = String(installed.version).split(".").map(Number);
            const patched = actual[0] > minimum[0] ||
              (actual[0] === minimum[0] && (actual[1] > minimum[1] ||
              (actual[1] === minimum[1] && actual[2] >= minimum[2])));
            if (!patched) {
              unexpected.push({ name, severity: advisory.severity, installed: installed.version, required: minimum.join(".") });
            } else {
              console.log("npm audit advisory reconciliado:", name, installed.version);
            }
          }

          if (unexpected.length) {
            console.error(JSON.stringify({ unexpected_vulnerabilities: unexpected }, null, 2));
            process.exit(1);
          }

          if (Object.keys(vulnerabilities).length) {
            console.log("npm audit encontrou somente avisos já reconciliados com versões corrigidas.");
          } else {
            console.log("npm audit limpo.");
          }
          NODE

          rm -f audit-report.json
          exit 0

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: E2E isolamento da análise por estágio
        run: npm run e2e:recruta:stage-isolation

      - name: E2E segurança do worker de IA
        run: npm run e2e:recruta:worker-security

      - name: E2E isolamento público de vagas
        run: npm run e2e:recruta:public-vagas

      - name: E2E de isolamento multi-tenant
        if: ${{ inputs.run_tenant_isolation }}
        run: npm run e2e:recruta:isolation

      - name: E2E fluxo completo candidato → IA → score
        if: ${{ inputs.run_full_e2e }}
        run: npm run e2e:recruta

      - name: E2E carga da fila de IA
        if: ${{ inputs.run_queue_load }}
        run: npm run e2e:recruta:queue

      - name: E2E carga REAL da IA (Gemini)
        if: ${{ inputs.run_real_ai_load }}
        run: npm run e2e:recruta:real-ai
