name: E2E - Multi-Tenant, Fluxo Completo e Carga

on:
  workflow_dispatch:
    inputs:
      run_full_e2e:
        description: "Executar fluxo completo candidato → candidatura → IA → score"
        required: true
        default: true
        type: boolean
      run_queue_load:
        description: "Executar teste de carga da fila de IA"
        required: true
        default: false
        type: boolean
      queue_jobs:
        description: "Quantidade de jobs sintéticos no teste de carga (1-1000)"
        required: true
        default: "200"
        type: string
      queue_concurrency:
        description: "Concorrência do teste de carga (4-32)"
        required: true
        default: "32"
        type: string
      run_real_ai_load:
        description: "Executar carga REAL da IA/Gemini"
        required: true
        default: false
        type: boolean
      real_ai_jobs:
        description: "Quantidade de análises reais com Gemini (1-200)"
        required: true
        default: "10"
        type: string
      real_ai_concurrency:
        description: "Concorrência de invocações do worker real (1-16)"
        required: true
        default: "2"
        type: string

permissions:
  contents: write

jobs:
  tenant-isolation:
    name: Segurança, dependências e isolamento multi-tenant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_QUEUE_JOBS: ${{ inputs.queue_jobs }}
      E2E_QUEUE_CONCURRENCY: ${{ inputs.queue_concurrency }}
      E2E_REAL_AI_JOBS: ${{ inputs.real_ai_jobs }}
      E2E_REAL_AI_CONCURRENCY: ${{ inputs.real_ai_concurrency }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerar package-lock com Node 24
        run: |
          npm install --package-lock-only
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json já está alinhado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: atualizar lockfile das dependências"
            git push origin main
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: E2E de isolamento multi-tenant
        run: npm run e2e:recruta:isolation

      - name: E2E fluxo completo candidato → IA → score
        if: ${{ inputs.run_full_e2e }}
        run: npm run e2e:recruta

      - name: E2E carga da fila de IA
        if: ${{ inputs.run_queue_load }}
        run: npm run e2e:recruta:queue

      - name: E2E carga REAL da IA (Gemini)
        if: ${{ inputs.run_real_ai_load }}
        run: npm run e2e:recruta:real-ai
