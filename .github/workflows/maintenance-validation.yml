name: Branch Validation - Maintenance

on:
  push:
    branches:
      - "maintenance/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Typecheck and production build (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
          cache: true

      - name: Type-check Edge Functions
        run: |
          deno check --config supabase/functions/email-verification/deno.json supabase/functions/email-verification/index.ts
          deno check --config supabase/functions/tenant-public-content-image/deno.json supabase/functions/tenant-public-content-image/index.ts

      - name: Build
        run: npm run build

  database-migrations:
    name: Replay all Supabase migrations in isolated local DB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # The legacy migration filenames no longer reflect the exact order
      # recorded on the current Supabase project. Rename only in this disposable
      # CI checkout so the replay follows the historical dependency order.
      - name: Normalize legacy migration order for disposable replay
        shell: bash
        run: |
          set -euo pipefail
          migrations="supabase/migrations"
          mv "$migrations/20260926140000_legacy_recruitment_baseline.sql" "$migrations/20260808095000_legacy_recruitment_baseline.sql"
          mv "$migrations/20260926130000_email_queue_retry_claim.sql" "$migrations/20260811120500_email_queue_retry_claim.sql"
          mv "$migrations/20260808101000_legacy_rpc_hardening.sql" "$migrations/20260811121000_legacy_rpc_hardening.sql"
          mv "$migrations/20260927140000_reconcile_rls_policy_intent.sql" "$migrations/20260927140200_reconcile_rls_policy_intent.sql"

      - name: Start local Supabase stack
        run: supabase start

      - name: Replay full migration chain without seed data
        run: supabase db reset --local --no-seed

      - name: Confirm migration state
        run: supabase migration list --local

      - name: Install PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi

      - name: Execute Phase 2B tests against isolated local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/recruta-supabase-local.env"
          set -a
          # Values are generated by the local CLI, never copied from repository secrets.
          source "$RUNNER_TEMP/recruta-supabase-local.env"
          set +a
          export SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"

          node <<'NODE'
          const localHosts = new Set(["127.0.0.1", "localhost", "::1", "[::1]"]);
          for (const [name, value] of [["API_URL", process.env.API_URL], ["DB_URL", process.env.DB_URL]]) {
            if (!value) throw new Error(name + " missing from local Supabase CLI status output");
            const url = new URL(value);
            if (!localHosts.has(url.hostname) || url.protocol !== (name === "API_URL" ? "http:" : "postgresql:")) {
              throw new Error("Refusing SQL test execution: " + name + " does not point to localhost");
            }
          }
          if (!process.env.SERVICE_ROLE_KEY || !process.env.SUPABASE_SERVICE_ROLE_KEY) {
            throw new Error("Local service role key missing from Supabase CLI output");
          }
          NODE

          node scripts/maintenance/create-phase2b-test-accounts.mjs

          run_guarded_sql() {
            local sql_file="$1"
            local safe_name
            safe_name="$(basename "$sql_file")"
            local wrapped="$RUNNER_TEMP/${safe_name}"
            printf "SET app.recruta_test_project_ref = 'local-phase2b-test';\n" > "$wrapped"
            cat "$sql_file" >> "$wrapped"
            echo "::group::SQL test: $safe_name"
            psql -X "$DB_URL" -v ON_ERROR_STOP=1 -f "$wrapped"
            echo "::endgroup::"
          }

          run_guarded_sql tests/fixtures/phase2b_test_environment.sql
          run_guarded_sql tests/fixtures/multi_tenant_seed.sql
          run_guarded_sql tests/rls/isolation.test.sql
          run_guarded_sql tests/rls/phase-2b-candidate-signup.test.sql
          run_guarded_sql tests/rls/phase-2b-public-content.test.sql
          run_guarded_sql tests/rls/phase-2b-security-isolation.test.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
