name: Phase 2B - Safe build validation

on:
  push:
    branches:
      - maintenance/phase-2-safe-ui-20261023
    paths:
      - "src/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".github/workflows/phase-2b-validation.yml"

permissions:
  contents: read

concurrency:
  group: phase-2b-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-validation:
    name: Type-check and build (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build
